services:
  ava-monitor:
    build: .
    image: ${IMAGE_NAME:-ava-monitor:latest}
    container_name: ${CONTAINER_NAME:-ava-monitor}
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Europe/Prague}
      - PYTHONUNBUFFERED=1
      - AVA_PROD_CLIENT_ID=${AVA_PROD_CLIENT_ID:-ava-monitor}
      - AVA_PROD_CLIENT_SECRET=${AVA_PROD_CLIENT_SECRET:-}
      - AVA_ALPHA_CLIENT_ID=${AVA_ALPHA_CLIENT_ID:-ASOLEU-AVAmonitor-AP-}
      - AVA_ALPHA_CLIENT_SECRET=${AVA_ALPHA_CLIENT_SECRET:-}
    env_file:
      - path: .env
        required: false
    volumes:
      - .:/app
    ports:
      - "${HOST_PORT:-8501}:${PORT:-8501}"
    labels:
      - "app=${CONTAINER_NAME:-ava-monitor}"
      - "maintainer=macikm"
