services:
  ava-monitor:
    build: .
    image: ava-monitor:latest
    container_name: ava-monitor
    restart: unless-stopped
    environment:
      - TZ=Europe/Prague
      - PYTHONUNBUFFERED=1
      - AVA_PROD_CLIENT_ID=${AVA_PROD_CLIENT_ID:-ava-monitor}
      - AVA_PROD_CLIENT_SECRET=${AVA_PROD_CLIENT_SECRET}
    env_file:
      - .env
    networks:
      - infrastructure_default
    volumes:
      - .:/app
    ports:
      - "8501:8501"

networks:
  infrastructure_default:
    external: true
